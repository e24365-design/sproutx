name: Update SMAP data
on:
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install earthaccess h5py numpy
      - run: python scripts/fetch_smap.py
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      - run: |
          git config user.name "sprout-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/smap.json
          git diff --cached --quiet || (git commit -m "Update SMAP data" && git push)
