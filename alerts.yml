name: Send SMS alerts
on:
  schedule: [{cron: "30 0 * * *"}]
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - run: python scripts/send_alerts.py
        env:
          SMSGATE_USER: ${{ secrets.SMSGATE_USER }}
          SMSGATE_PASS: ${{ secrets.SMSGATE_PASS }}
          SUBSCRIBERS_JSON: ${{ secrets.SUBSCRIBERS_JSON }}
